# Builds the container image and publishes it to GitHub Container Registry.
#
# This is what makes "re-containerise after a change" automatic: merge to main
# and a fresh image appears at ghcr.io/<owner>/rdm_classic:latest. Tagging a
# release (v1.1.0) also produces :1.1.0 and :1.1 so deployments can pin.
#
# Runs alongside deploy.yml, which publishes the same commit to GitHub Pages.
# Neither knows about the other.

name: Build container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed for multi-architecture builds: institutional servers are
      # generally amd64, Apple laptops are arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: they build to check the Dockerfile still
      # works, but must not publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Container serves at the root. The GitHub Pages build gets its
          # /RDM_CLASSIC/ base from vite.config.ts in deploy.yml instead.
          build-args: |
            BASE_PATH=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
