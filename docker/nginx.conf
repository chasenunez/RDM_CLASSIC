# Serving config for RDM Classic.
#
# The app is a static site with no router, no API and no server-side anything,
# so this is almost entirely about caching correctly.

server {
    # 8080, not 80, because the image runs as an unprivileged user and only
    # root may bind ports below 1024.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The sample project deliberately contains filenames with spaces, such as
    # "soil samples.xlsx" and "Text file.svg". That is the lesson, not an
    # oversight. The app requests them percent-encoded (see useFileContent.ts);
    # nginx decodes and serves them as-is. Do not "tidy" these filenames, and
    # if you change anything here, re-test that one of them still loads.

    # Vite fingerprints everything in /assets/ with a content hash, so a given
    # URL can never change meaning. Safe to cache effectively forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # These are copied verbatim from public/ and keep their filenames from one
    # build to the next, so the same URL *does* change meaning after an update.
    # They must revalidate, or players keep serving themselves the old game.
    location ~ ^/(files|icons|downloads|fonts)/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # The entry point is never cached. If it were, a redeploy would reach
    # nobody: browsers would keep loading the old index.html, which points at
    # the old hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # No client-side router today, so this is just a safety net: an unknown
    # path returns the app rather than an nginx 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Worth doing for the JS bundle, CSS, SVG icons and JSON. The PNG art is
    # already compressed and is skipped.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml
                      text/csv;

    # Quietly drop favicon noise from the access log.
    location = /favicon.ico { access_log off; log_not_found off; }
}
